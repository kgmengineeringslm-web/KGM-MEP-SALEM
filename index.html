    <style>
        :root {
            --primary-color: #004a99; 
            --secondary-color: #ffb700; 
            --dark-text: #333333;
            --light-bg: #f4f7f6;
            --white: #ffffff;
            --shadow: 0 10px 30px rgba(0,0,0,0.1);

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            font-family: 'Open Sans', sans-serif; 
            line-height: 1.7; 
            color: var(--dark-text); 
            background-color: var(--light-bg);

        }

        h1, h2, h3, h4 { font-family: 'Montserrat', sans-serif; font-weight: 700; color: var(--primary-color); }

        /* --- HEADER & NAVIGATION --- */
        header {

            justify-content: space-between;

            position: fixed; 
            width: 100%;
            top: 0; 
            z-index: 1000; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            backdrop-filter: blur(10px);
            transition: all 0.4s ease;
        }
        
        /* JavaScript will add this class when scrolling */

            background: rgba(0, 42, 85, 0.98);

            text-decoration: none;

            padding-bottom: 5px;
            transition: color 0.3s;
        }
        nav a::after {
            content: ''; position: absolute; bottom: 0; left: 0; width: 0; height: 2px; 
            background: var(--secondary-color); transition: width 0.3s ease;
        }
        nav a:hover { color: var(--secondary-color); }
        nav a:hover::after { width: 100%; }

            color: #002244;

            border-radius: 50px;

            letter-spacing: 1px;
            transition: all 0.3s ease;
            display: inline-block;
            box-shadow: 0 10px 20px rgba(255, 183, 0, 0.3);
            opacity: 0; animation: fadeInUp 1s ease forwards 0.9s;
        }
        .btn:hover { 
            transform: translateY(-5px); 
            box-shadow: 0 15px 25px rgba(255, 183, 0, 0.5); 
            background: #ffcc33; 
        }

        /* --- SCROLL REVEAL ANIMATION CLASSES --- */

            opacity: 0;
            transform: translateY(50px);

        }
        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }

        .service-item:hover {
            background: var(--primary-color);
            color: var(--white);
            border-bottom: 3px solid var(--secondary-color);
            transform: translateY(-5px);

        .service-item:hover i { transform: scale(1.2); }
