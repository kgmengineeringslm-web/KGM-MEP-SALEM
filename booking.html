<!-- Form Section -->
            <form id="bookingForm">
                
                <!-- Row 1: Name & Phone -->
                <div class="form-row">
                    <div class="form-group">
                        <label><i class="fas fa-user"></i> Full Name</label>
                        <input type="text" id="custName" class="form-control" placeholder="Enter your full name" required>
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-phone"></i> Phone Number</label>
                        <input type="tel" id="custPhone" class="form-control" placeholder="Enter phone number" required>
                    </div>
                </div>

                <!-- Row 2: Email & Service Type -->
                <div class="form-row">
                    <div class="form-group">
                        <label><i class="fas fa-envelope"></i> Email Address</label>
                        <input type="email" id="custEmail" class="form-control" placeholder="Enter email (optional)">
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-tools"></i> Required Service</label>
                        <select id="reqService" class="form-control" required>
                            <option value="" disabled selected>Select a service</option>
                            <option value="House Wiring & Repairs">House Wiring & Repairs</option>
                            <option value="Commercial & Industrial Wiring">Commercial & Industrial Wiring</option>
                            <option value="Plumbing & Mechanical Works">Plumbing & Mechanical Works</option>
                            <option value="Solar Installation">Solar Installation</option>
                            <option value="Fire Safety Setup">Fire Safety Setup</option>
                            <option value="AMC - Basic Plan">AMC - Basic Plan</option>
                            <option value="AMC - Premium Plan">AMC - Premium Plan</option>
                            <option value="AMC - Custom Plan Inquiry">AMC - Custom Plan Inquiry</option>
                        </select>
                    </div>
                </div>

                <!-- Row 3: Date & Time -->
                <div class="form-row">
                    <div class="form-group">
                        <label><i class="fas fa-calendar-alt"></i> Preferred Date</label>
                        <input type="date" id="prefDate" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-clock"></i> Preferred Time Slot</label>
                        <select id="prefTime" class="form-control" required>
                            <option value="" disabled selected>Select time slot</option>
                            <option value="Morning (9 AM - 12 PM)">Morning (9:00 AM - 12:00 PM)</option>
                            <option value="Afternoon (12 PM - 4 PM)">Afternoon (12:00 PM - 4:00 PM)</option>
                            <option value="Evening (4 PM - 7 PM)">Evening (4:00 PM - 7:00 PM)</option>
                        </select>
                    </div>
                </div>

                <!-- Row 4: Service Address -->
                <div class="form-row">
                    <div class="form-group">
                        <label><i class="fas fa-map-marker-alt"></i> Service Location Address</label>
                        <textarea id="servAddress" class="form-control" placeholder="Enter your complete site address in Salem" required></textarea>
                    </div>
                </div>

                <!-- Row 5: Description -->
                <div class="form-row">
                    <div class="form-group">
                        <label><i class="fas fa-comment-alt"></i> Brief Issue Description</label>
                        <textarea id="issueDesc" class="form-control" placeholder="Describe the problem or your requirements in detail..."></textarea>
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" id="submitBtn" class="btn-submit">Confirm Booking Request</button>

            </form>

            <!-- JavaScript for Email & WhatsApp Integration -->
            <script>
                document.getElementById('bookingForm').addEventListener('submit', function(e) {
                    e.preventDefault(); 
                    var btn = document.getElementById('submitBtn');
                    btn.innerHTML = "Processing...";
                    btn.disabled = true;
                    var name = document.getElementById('custName').value;
                    var phone = document.getElementById('custPhone').value;
                    var email = document.getElementById('custEmail').value || "Not Provided";
                    var service = document.getElementById('reqService').value;
                    var date = document.getElementById('prefDate').value;
                    var time = document.getElementById('prefTime').value;
                    var address = document.getElementById('servAddress').value;
                    var desc = document.getElementById('issueDesc').value || "None";

                    fetch("https://formsubmit.co/ajax/kgmengineeringslm@gmail.com", {
                        method: "POST",
                        headers: { 
                            'Content-Type': 'application/json',
                            'Accept': 'application/json'
                        },
                        body: JSON.stringify({
                            _subject: "New Service Booking from Website!",
                            Customer_Name: name,
                            Phone_Number: phone,
                            Email_Address: email,
                            Required_Service: service,
                            Preferred_Date: date,
                            Preferred_Time: time,
                            Address: address,
                            Issue_Description: desc
                        })
                    })
                    .then(response => response.json())
                    .then(data => {
                        var whatsappNumber = "919786433883"; 
                        
                        var whatsappMessage = "Hello KGM MEP Services, I would like to book a service.%0a%0a" +
                                              "*Customer Details:*%0a" +
                                              "👤 Name: " + name + "%0a" +
                                              "📞 Phone: " + phone + "%0a" +
                                              "🔧 Service: " + service + "%0a" +
                                              "📅 Date: " + date + "%0a" +
                                              "⏰ Time: " + time + "%0a" +
                                              "📍 Address: " + address + "%0a" +
                                              "💬 Description: " + desc;

                        var whatsappURL = "https://wa.me/" + whatsappNumber + "?text=" + whatsappMessage;
                        window.location.href = whatsappURL;
                    })
                    .catch(error => {
                        alert("Something went wrong. Please try again or contact us directly on WhatsApp.");
                        btn.innerHTML = "Confirm Booking Request";
                        btn.disabled = false;
                    });
                });
            </script>
